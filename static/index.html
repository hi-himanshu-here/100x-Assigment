<!DOCTYPE html>
<html>
<head>
  <title>Himanshu AI Voice Agent</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    #chat {
      border: 1px solid #ccc;
      padding: 10px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .user {
      color: blue;
      margin: 5px 0;
    }

    .ai {
      color: green;
      margin: 5px 0;
    }

    button {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>🎙️ Talk to Himanshu (AI Voice Agent)</h2>

<div id="chat"></div>

<button onclick="startListening()">Start Talking</button>

<script>

const chatBox = document.getElementById("chat");

function addMessage(text, className) {
  const div = document.createElement("div");
  div.className = className;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = "en-US";

function startListening() {
  addMessage("🎤 Listening...", "user");
  recognition.start();
}

recognition.onresult = async function(event) {
  const userText = event.results[0][0].transcript;

  addMessage("You: " + userText, "user");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: userText })
    });

    const data = await res.json();

    addMessage("Himanshu AI: " + data.response, "ai");

    const speech = new SpeechSynthesisUtterance(data.response);
    speechSynthesis.speak(speech);

  } catch (error) {
    addMessage("❌ Error contacting server", "ai");
    console.error(error);
  }
};

recognition.onerror = function(event) {
  addMessage("❌ Speech recognition error: " + event.error, "ai");
};

</script>

</body>
</html>
