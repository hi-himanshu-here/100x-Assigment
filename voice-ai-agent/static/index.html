<!DOCTYPE html>
<html>
<head>
  <title>Himanshu AI Voice Agent</title>
</head>
<body>
  <h2>🎙️ Talk to Himanshu (AI)</h2>
  <button onclick="startListening()">Start Talking</button>
  <p id="userText"></p>
  <p id="aiText"></p>

  <script>
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';

    function startListening() {
      recognition.start();
    }

    recognition.onresult = async function(event) {
      const text = event.results[0][0].transcript;
      document.getElementById("userText").innerText = "You: " + text;

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      document.getElementById("aiText").innerText = "Himanshu AI: " + data.response;

      const speech = new SpeechSynthesisUtterance(data.response);
      speechSynthesis.speak(speech);
    };
  </script>
</body>
</html>
